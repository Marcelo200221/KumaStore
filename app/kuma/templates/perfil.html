<!DOCTYPE html>
<html lang="en">
<head>
    {% load static %}
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" type="text/css" href="{% static 'CSS/style-perfil.css '%}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-9ndCyUaIbzAi2FUVXJi0CjmCapSmO7SnpJef0486qhLnuZ2cdeRhO02iuK6FUUVM" crossorigin="anonymous">
    <title>Perfil</title>
</head>
<body>
    <div>
        {% if user.is_authenticated %}
        <h1 class="bienvenida">Bienvenido {{ user.username }}</h1>
        <div class="general">
            <div class="datos">
                <h3>Datos</h3>
                
                    <div class="campos">
                        <form action="{% url 'editar-usuario' %}" id="editar-form" method="post">
                            {% csrf_token %}
                            <div class="campo-nombre">
                                <p>Nombre:</p>
                                <input type="text" id="name-input" name="username" disabled value="{{ user.username }}">
                            </div>
                            <div class="campo-email">
                                <p>Email:</p>
                                <input type="text" id="email-input" name="email" disabled value="{{ user.email }}">
                            </div>
                        </form>
                    </div>
                    <div class="botones">
                        <button class="btn btn-primary" id="boton-editar">Editar</button>
                        <button type="submit" id="boton-guardar" class="btn btn-success d-none">Guardar</button>
                    </div>
                
            </div>
            <a type="button" href="/inicio" class="btn btn-secondary volver-inicio">Volver a inicio</a>
        </div>

        {% else %}
        <h1>No estás iniciado</h1>
        {% endif %}
    </div>
</body>
<script type="text/javascript" src="{% static 'JS/funciones-perfil.js '%}"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.min.js" integrity="sha384-fbbOQedDUMZZ5KreZpsbe1LCZPVmfTnH7ois6mU1QK+m14rQ1l2bGBq41eYeM/fS" crossorigin="anonymous"></script>
</html>
